name: 청약 알림 체크

on:
  schedule:
    # cron은 UTC 기준. KST = UTC+9
    # 정각/30분같이 몰리는 시각은 GitHub Actions 스케줄이 지연되기 쉬워서
    # (공식 권장사항) 일부러 몇 분 어긋난 시각을 씀.
    # (임시 테스트) 09:18 KST -> 00:18 UTC — 확인 끝나면 08:37로 되돌릴 것
    - cron: "18 0 * * *"
    # 매일 20:13 KST 근처(전날 저녁) -> 당일 11:13 UTC
    - cron: "13 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 청약 공고 확인 및 알림 발송
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python scripts/main.py

      - name: 알림 이력(state.json) 커밋
        run: |
          git config user.name "cheongyak-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update notified state"
          git push
