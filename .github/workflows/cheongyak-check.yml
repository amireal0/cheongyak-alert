name: 청약 알림 체크

on:
  schedule:
    # cron은 UTC 기준. KST = UTC+9
    # 정각/30분같이 몰리는 시각은 GitHub Actions 스케줄이 지연되기 쉬워서
    # (공식 권장사항) 일부러 몇 분 어긋난 시각을 씀.
    # 매일 08:37 KST 근처(당일 아침) -> 전날 23:37 UTC
    - cron: "37 23 * * *"
    # 매일 20:13 KST 근처(전날 저녁) -> 당일 11:13 UTC
    - cron: "13 11 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "morning(오늘) 또는 evening(내일) 중 어느 회차인지. cron-job.org 등 외부에서 호출할 때 명시. 비우면 실행 시각(14시 기준)으로 추정."
        required: false
        type: choice
        options: ["", "morning", "evening"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 청약 공고 확인 및 알림 발송
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          GITHUB_EVENT_INPUTS_KIND: ${{ github.event.inputs.kind }}
        run: python scripts/main.py

      - name: 알림 이력(state.json) 커밋
        run: |
          git config user.name "cheongyak-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update notified state"
          git push
